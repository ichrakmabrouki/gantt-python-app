# Thème de base de Streamlit.
#
# Sans ce fichier, Streamlit suit le réglage clair/sombre du système du
# visiteur : chez l'un l'interface partait en clair, chez l'autre en sombre,
# sans rapport avec l'habillage de l'application.
#
# Le thème est donc fixé ici, et il est le même pour tout le monde. C'est aussi
# ce qui gouverne les composants que Streamlit dessine lui-même — en premier
# lieu les tableaux `st.dataframe`, rendus dans un canvas qu'aucune feuille de
# style ne peut repeindre.
[theme]
base                     = "dark"
primaryColor             = "#ff7a1a"
backgroundColor          = "#070a10"
secondaryBackgroundColor = "#121724"
textColor                = "#c6cede"
font                     = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
